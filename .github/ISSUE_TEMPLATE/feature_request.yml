name: Feature request
description: 새로 만들거나 고치고 싶은 것
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇을 · 왜
      description: 만들 것과 필요한 이유를 적어 주세요
      placeholder: ex) 보낸 메시지 목록에 도착 예정일(D-2, D-1)을 보여 준다. 언제 도착하는지 몰라 답답하다는 의견이 있었다
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      description: 작게 나눠 적고, 끝나면 체크해 주세요
      value: |
        - [ ]
  - type: textarea
    id: refs
    attributes:
      label: 참고 자료
      description: 피그마, 기획 문서, 관련 이슈 링크
